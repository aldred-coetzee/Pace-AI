[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pace-ai"
version = "0.1.0"
description = "AI running coach: Flask UI, training analysis and data clients for Strava, Garmin, Withings and Notion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Aldred Coetzee" },
]
keywords = ["running", "coaching", "vdot", "strava", "garmin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "garminconnect>=0.2",
    "garth>=0.4",
    "withings-sync>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/aldred-coetzee/Pace-AI"
Repository = "https://github.com/aldred-coetzee/Pace-AI"
"Bug Tracker" = "https://github.com/aldred-coetzee/Pace-AI/issues"

[project.scripts]
pace-ai-garmin-login = "pace_ai.garmin.auth:login_cli"
pace-ai-serve = "ui.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pace_ai", "ui"]

[tool.ruff]
target-version = "py310"
line-length = 120

extend-exclude = ["research", "research_archive"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "TCH",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Prompt text, HTML templates and status copy: long lines and typographic dashes are content.
"ui/config.py" = ["E501"]
"ui/templates.py" = ["E501"]
"ui/status.py" = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["pace_ai", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

asyncio_mode = "auto"
